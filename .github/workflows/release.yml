name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version and package
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          ./erstellezip.sh
          sha256sum "pcmonitor-$(cat VERSION).zip" > SHA256SUMS
      - name: Draft, upload and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat VERSION)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "pcmonitor $version" --notes-file RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" "pcmonitor-$version.zip" SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
